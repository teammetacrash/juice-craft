{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>JUICE CRAFT — Admin Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'core/css/app.css' %}">
</head>
<body class="login-body">
  <main class="login-shell">
    <section class="login-brand-panel">
      <img src="{% static 'core/img/juice-craft-logo.jpg' %}" class="login-logo" alt="JUICE CRAFT logo">
      <div class="login-copy">
        <span class="eyebrow">STORE MANAGEMENT</span>
        <h1>JUICE CRAFT</h1>
        <p>Sales, stock, billing, wastage and reports — in one clean workspace.</p>
      </div>
    </section>
    <section class="login-card-wrap">
      <div class="login-card">
        <div class="mobile-logo-wrap">
          <img src="{% static 'core/img/juice-craft-logo.jpg' %}" class="mobile-login-logo" alt="JUICE CRAFT">
        </div>
        <span class="eyebrow">ADMIN ACCESS</span>
        <h2>Welcome back</h2>
        <p class="muted-copy">Sign in to manage your shop.</p>
        {% if error %}<div class="alert brand-alert">{{ error }}</div>{% endif %}
        <form method="post" class="mt-4">
          {% csrf_token %}
          <label class="form-label">Username</label>
          <input class="form-control form-control-lg" name="username" autocomplete="username" required autofocus>
          <label class="form-label mt-3">Password</label>
          <div class="password-wrap">
            <input class="form-control form-control-lg" type="password" id="password" name="password" autocomplete="current-password" required>
            <button class="password-toggle" type="button" onclick="const p=document.getElementById('password');p.type=p.type==='password'?'text':'password';this.textContent=p.type==='password'?'Show':'Hide'">Show</button>
          </div>
          <button class="btn brand-btn btn-lg w-100 mt-4" type="submit">Enter JUICE CRAFT</button>
        </form>
      </div>
    </section>
  </main>
</body>
</html>
