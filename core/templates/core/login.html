{% load static %}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JUICE CRAFT Admin Login</title>
<link rel="stylesheet" href="{% static 'core/css/app.css' %}">
</head>
<body class="login-body">
<main class="login-shell">
<section class="login-brand-panel">
<div class="login-brand-mark">JC</div>
<div class="login-copy">
<span class="eyebrow">STORE MANAGEMENT</span>
<h1>JUICE CRAFT</h1>
<p>Sales, stock, billing, wastage and reports in one clean workspace.</p>
</div>
</section>
<section class="login-card-wrap">
<div class="login-card">
<div class="mobile-logo-wrap"><div class="mobile-login-mark">JC</div></div>
<span class="eyebrow">ADMIN ACCESS</span>
<h2>Welcome back</h2>
<p class="muted-copy">Sign in to manage your shop.</p>
{% if error %}<div class="brand-alert">{{ error }}</div>{% endif %}
<form method="post" class="mt-4">
{% csrf_token %}
<label class="form-label">Username</label>
<input class="form-control" name="username" autocomplete="username" required autofocus>
<label class="form-label">Password</label>
<input class="form-control" type="password" name="password" autocomplete="current-password" required>
<button class="brand-btn w-100 mt-4" type="submit">Enter JUICE CRAFT</button>
</form>
</div>
</section>
</main>
</body>
</html>
